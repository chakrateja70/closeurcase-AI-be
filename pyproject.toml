[project]
name = "closeurcase-ai-be"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.22.0",
    # Used directly by `utils.url_fetch` (downloading a linked document) and
    # by `summary_providers` for its error types. It arrives transitively via
    # openai/google-genai anyway, but relying on that would let either of them
    # drop it in a minor release and break us.
    "httpx>=0.28.1",
    "openai>=3.6.0",
    # PDF text extraction. BSD-licensed - do NOT swap in PyMuPDF/fitz, which is
    # AGPL and would infect this service.
    "pypdf>=6.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    # Required by FastAPI to parse multipart uploads; without it the
    # case_summarization router raises at import, not at request time.
    "python-multipart>=0.0.20",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Absolute imports rooted at `src.` (the project convention) need the project
# root on sys.path; there are no __init__.py files to make pytest infer it.
pythonpath = ["."]
testpaths = ["test"]
